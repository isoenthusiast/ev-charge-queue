<text x="76" y="84" fill="#53e0c4" font-size="22" font-weight="700">ED APP STARTER · BEGINNER DEPLOYMENT</text>
<text x="76" y="155" fill="white" font-size="54" font-weight="700">Your idea. Your repo.</text>
<text x="76" y="218" fill="white" font-size="54" font-weight="700">Your running app.</text>
<text x="76" y="270" fill="#bfd0e1" font-size="24">GitHub + Railway Hobby + a coding agent with tool access</text>
<text x="76" y="310" fill="#bfd0e1" font-size="22">ChatGPT/Codex or Hermes · subscriptions and access configured separately</text>
<rect x="64" y="354" width="1072" height="140" rx="18" fill="#1b2d43"/>
<text x="91" y="408" fill="#53e0c4" font-size="34" font-weight="700">01</text>
<text x="167" y="394" fill="white" font-size="25" font-weight="700">COPY THE TEMPLATE</text>
<text x="167" y="433" fill="#dbe5f0" font-size="24">Create your own GitHub repository.</text>
<text x="167" y="466" fill="#aec1d4" font-size="21">Keep new app repositories private by default.</text>
<rect x="64" y="514" width="1072" height="140" rx="18" fill="#1b2d43"/>
<text x="91" y="568" fill="#53e0c4" font-size="34" font-weight="700">02</text>
<text x="167" y="554" fill="white" font-size="25" font-weight="700">BRIEF YOUR CODING AGENT</text>
<text x="167" y="593" fill="#dbe5f0" font-size="24">Share your app idea + the repo starter pack.</text>
<text x="167" y="626" fill="#aec1d4" font-size="21">Authorize the correct GitHub and Railway accounts.</text>
<rect x="64" y="674" width="1072" height="140" rx="18" fill="#1b2d43"/>
<text x="91" y="728" fill="#53e0c4" font-size="34" font-weight="700">03</text>
<text x="167" y="714" fill="white" font-size="25" font-weight="700">VERIFY THE FOUNDATION</text>
<text x="167" y="753" fill="#dbe5f0" font-size="24">Run the included tests with disposable PostgreSQL.</text>
<text x="167" y="786" fill="#aec1d4" font-size="21">Green tests prove behavior; review SECURITY.md too.</text>
<rect x="64" y="834" width="1072" height="140" rx="18" fill="#1b2d43"/>
<text x="91" y="888" fill="#53e0c4" font-size="34" font-weight="700">04</text>
<text x="167" y="874" fill="white" font-size="25" font-weight="700">RECREATE THE ENVIRONMENT</text>
<text x="167" y="913" fill="#dbe5f0" font-size="24">Railway: your app service + Postgres + persistent volume.</text>
<text x="167" y="946" fill="#aec1d4" font-size="21">Apply Docker, migration and healthcheck settings.</text>
<rect x="64" y="994" width="1072" height="140" rx="18" fill="#1b2d43"/>
<text x="91" y="1048" fill="#53e0c4" font-size="34" font-weight="700">05</text>
<text x="167" y="1034" fill="white" font-size="25" font-weight="700">SET SECRETS &amp; DEPLOY</text>
<text x="167" y="1073" fill="#dbe5f0" font-size="24">Generate fresh secrets. Connect the database by reference.</text>
<text x="167" y="1106" fill="#aec1d4" font-size="21">Create HTTPS domain → set APP_URL → deploy.</text>
<rect x="64" y="1154" width="1072" height="140" rx="18" fill="#1b2d43"/>
<text x="91" y="1208" fill="#53e0c4" font-size="34" font-weight="700">06</text>
<text x="167" y="1194" fill="white" font-size="25" font-weight="700">CHECK THE LIVE APP</text>
<text x="167" y="1233" fill="#dbe5f0" font-size="24">Health checks → login → records → redeploy persistence.</text>
<text x="167" y="1266" fill="#aec1d4" font-size="21">Test backups before storing important data.</text>
<text x="76" y="1370" fill="#53e0c4" font-size="23" font-weight="700">REUSE THE CONFIGURATION. GENERATE YOUR OWN ENVIRONMENT.</text>
<text x="76" y="1413" fill="#bfd0e1" font-size="22">Fresh database, secrets and domain for every app. Never copy live credentials.</text>
<text x="76" y="1460" fill="#ffd58c" font-size="21">Known dependency advisory: read SECURITY.md before production use.</text>
<text x="76" y="1500" fill="#bfd0e1" font-size="20">Railway usage may exceed the Hobby minimum. Set a budget and review costs.</text>
<text x="76" y="1552" fill="white" font-size="21">github.com/isoenthusiast/ed-app-starter-public · Full steps: docs/BEGINNER_DEPLOYMENT.md</text>
<g id="repository-qr">
<rect x="64" y="1590" width="1072" height="310" rx="18" fill="#1b2d43"/>
<text x="92" y="1660" fill="#53e0c4" font-size="27" font-weight="700">SCAN TO GET THE STARTER</text>
<text x="92" y="1710" fill="white" font-size="26">Open the GitHub template.</text>
<text x="92" y="1752" fill="#bfd0e1" font-size="23">Choose “Use this template” to begin.</text>
<text x="92" y="1810" fill="#bfd0e1" font-size="21">github.com/isoenthusiast/</text>
<text x="92" y="1841" fill="white" font-size="23" font-weight="700">ed-app-starter-public</text>
