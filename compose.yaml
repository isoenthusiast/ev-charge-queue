services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: starter
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: starter_dev
    ports: ['127.0.0.1:5432:5432']
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/01-test.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U starter -d starter_dev']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
