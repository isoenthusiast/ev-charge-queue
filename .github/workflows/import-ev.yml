name: Import and verify EV app
on:
  push:
    paths: ['.github/workflows/import-ev.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.repository == 'isoenthusiast/ev-charge-queue'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: starter
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: starter_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U starter -d starter_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://starter:ci-only-password@127.0.0.1:5432/starter_test
    steps:
      - uses: actions/checkout@v4
      - name: Import reviewed EV source
        run: |
          test -f ev-source.zip || exit 0
          echo 'cf976e187f694d898954fbc40ecbf1fafcf326a70312c9a5fd8a01ae9f176229  ev-source.zip' | sha256sum --check
          python3 - <<'PY'
          import pathlib, zipfile
          with zipfile.ZipFile('ev-source.zip') as z:
            for i in z.infolist():
              p = pathlib.PurePosixPath(i.filename)
              assert not p.is_absolute() and '..' not in p.parts and p.parts[0] != '.github'
              d = pathlib.Path(p)
              d.parent.mkdir(parents=True, exist_ok=True)
              d.write_bytes(z.read(i))
          pathlib.Path('ev-source.zip').unlink()
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Record EV verification and preserve current admin form state'
          git push
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@11.9.0
      - run: npm ci
      - run: npm run starter:init -- --name ev-charge-queue
      - run: npx playwright install --with-deps chromium
      - run: npm run starter:verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ev-browser-previews
          path: artifacts/ev-queue-*.png
          retention-days: 7

