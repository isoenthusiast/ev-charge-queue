name: Verify starter
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: starter
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: starter_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U starter -d starter_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://starter:ci-only-password@127.0.0.1:5432/starter_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install -g npm@11.9.0
      - run: npm ci
      - run: npm run starter:init -- --name ci-starter
      - run: npx playwright install --with-deps chromium
      - run: npm run starter:verify
